
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            <h2>My Dashboard</h2>
            <p>Welcome, Anushka!</p>
        </header>

        <!-- Sidebar -->
        <aside>
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main>
            <h2>Dashboard Overview</h2>

            <div class="gallery">

                <div class="item">
                    <span class="icon">&#128100;</span>
                    <div>
                        <b>120</b>
                        <p>Users</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#128176;</span>
                    <div>
                        <b>Rs 45k</b>
                        <p>Sales</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#128230;</span>
                    <div>
                        <b>36</b>
                        <p>Orders</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#11088;</span>
                    <div>
                        <b>4.8</b>
                        <p>Rating</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#128172;</span>
                    <div>
                        <b>18</b>
                        <p>Messages</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#9989;</span>
                    <div>
                        <b>92%</b>
                        <p>Done</p>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer>
            Made with CSS Grid | Assignment 7
        </footer>

    </div>

</body>
</html>
